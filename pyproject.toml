[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethiopia-econ"
version = "0.1.0"
description = "A reproducible pipeline for exploring Ethiopian macroeconomic indicators (World Bank data)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]
